[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burrowsift"
version = "0.2.0"
description = "A Python document-processing application for metadata extraction, local AI summarisation and classification, deterministic sorting, and indexing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Richard Martin" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.urls]
Homepage = "https://github.com/BurrowWerks/BurrowSift"
Repository = "https://github.com/BurrowWerks/BurrowSift"
Issues = "https://github.com/BurrowWerks/BurrowSift/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
