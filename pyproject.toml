[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document_parser"
version = "0.1.0"
description = "v.0.0.1 for the Document_Praser Project. Project's goal is to create an application that takes documents as input. Parses the meta-data and text. Then converts the text to a new .txt file before feeding that file to a locally run Ollama model for summary."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Richard Martin" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
